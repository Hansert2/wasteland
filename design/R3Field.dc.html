<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --void: #0B0A08; --ground: #171614; --strip: #1E1D1A; --panel: #1E1D1A;
      --rule: #33312C; --rule-in: #26241F; --edge: #4A463E; --control: #55504E;
      --bone: #E4E1D8; --prose: #CFCBC0; --value: #DCD8CD;
      --dim: #999588; --quiet: #7A766C; --faint: #6F6B62;
      --oxide: #C2632C; --oxide-light: #DD8F4A;
      --label: 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif;
      --body: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --numer: ui-monospace, Menlo, Consolas, monospace;
    }
    body { margin: 0; background: var(--ground); color: var(--prose);
           font-family: var(--body); font-size: 16.5px; line-height: 1.6; }
    a { color: var(--dim); } a:hover { color: var(--bone); }
    .wrap { padding: 20px 24px; }
    .block { border: 1px solid var(--rule); background: var(--ground);
             display: flex; flex-direction: column; }
    .block > h2 { margin: 0; padding: 11px 18px; background: var(--strip);
      border-bottom: 1px solid var(--rule); font-family: var(--label); font-weight: 700;
      font-size: 10px; line-height: 1; letter-spacing: .18em; text-transform: uppercase;
      color: var(--dim); }
    .block-body { padding: 15px 18px; }
    .tag { font-family: var(--label); font-weight: 700; font-size: 10px; line-height: 1.4;
           letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }

    /*
     * The plate IS the distance. The animal was photographed where it stands, so the ground
     * between the camera and it is already drawn -- what the block adds is a rule along that
     * ground saying how much of it has been closed.
     */
    .plate { position: relative; border-bottom: 1px solid var(--rule); overflow: hidden; }
    .plate img { display: block; width: 100%; height: 236px; object-fit: cover;
                 object-position: 50% 42%; }
    /* The ground the plate is standing on, pulled down so the figures read on it. */
    .plate::after { content: ''; position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(11,10,8,.55) 0%, rgba(11,10,8,.1) 38%,
                                             rgba(11,10,8,.72) 100%); }

    /* The approach, laid along the ground of the photograph itself. */
    .run { position: absolute; left: 30px; right: 30px; bottom: 44px; height: 1px;
           background: rgba(228,225,216,.22); z-index: 2; }
    .run .closed { position: absolute; left: 0; top: 0; height: 1px; width: 62%;
                   background: var(--oxide); }
    .run .peg { position: absolute; top: -5px; width: 1px; height: 11px;
                background: rgba(228,225,216,.35); }
    .run .you { position: absolute; left: 62%; top: -34px; transform: translateX(-50%);
                display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .run .you .pip { width: 9px; height: 9px; background: var(--bone);
                     transform: rotate(45deg); }
    .run .you .nm, .run .them .nm {
      font-family: var(--label); font-weight: 700; font-size: 9.5px; letter-spacing: .16em;
      text-transform: uppercase; color: var(--bone); white-space: nowrap;
      text-shadow: 0 1px 3px rgba(11,10,8,.9); }
    .run .them { position: absolute; left: 100%; top: -34px; transform: translateX(-50%);
                 display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .run .them .pip { width: 9px; height: 9px; border: 1px solid var(--oxide-light);
                      transform: rotate(45deg); }
    /* What crossing the last of it costs, hung under the gap it belongs to. */
    .run .cost { position: absolute; left: 81%; top: 10px; transform: translateX(-50%);
                 font-family: var(--numer); font-size: 11.5px; color: var(--oxide-light);
                 white-space: nowrap; text-shadow: 0 1px 3px rgba(11,10,8,.9); }

    /* The verdict, over the plate, because it is the thing the picture is about. */
    .verdict { position: absolute; left: 22px; top: 18px; z-index: 2; }
    .verdict .word { display: block; font-family: var(--label); font-weight: 700;
      font-size: 30px; line-height: 1; letter-spacing: .03em; text-transform: uppercase;
      color: var(--bone); text-shadow: 0 2px 8px rgba(11,10,8,.9); }
    .verdict .sub { display: block; margin-top: 4px; font-family: var(--numer);
      font-size: 11.5px; color: rgba(228,225,216,.72); text-shadow: 0 1px 3px rgba(11,10,8,.9); }

    .reads { display: flex; flex-wrap: wrap; }
    .cell { display: flex; flex-direction: column; gap: 4px; padding: 13px 20px;
            border-right: 1px solid var(--rule-in); }
    .cell:last-child { border-right: 0; }
    .cell .val { font-family: var(--numer); font-size: 18px; line-height: 1.15;
                 color: var(--value); font-variant-numeric: tabular-nums; }
    .cell .val i { font-style: normal; color: var(--faint); font-size: 12px; }
    .cell .val.small { font-family: var(--label); font-weight: 700; font-size: 15px;
                       letter-spacing: .04em; text-transform: uppercase; color: var(--prose); }
    .cell .sub { font-family: var(--numer); font-size: 11px; color: var(--faint); }

    .moves { display: flex; flex-wrap: wrap; gap: 9px; padding: 14px 18px 16px;
             border-top: 1px solid var(--rule); }
    .move { display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
            min-width: 172px; padding: 12px 14px; border: 1px solid var(--control);
            background: var(--panel); font-family: var(--label); font-weight: 700;
            font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
            color: var(--prose); text-align: left; cursor: pointer; }
    .move .why { font-size: 10px; font-weight: 400; letter-spacing: .08em;
                 text-transform: lowercase; color: var(--faint); }
    .move.take { border-color: var(--oxide); }
    .move.away { min-width: 0; }
  </style>
</helmet>
<div class="wrap">
  <div class="block">
    <h2>Nim is out after a boar</h2>

    <div class="plate">
      <img src="plate-boar.webp" alt="">
      <div class="verdict">
        <span class="word">Clean</span>
        <span class="sub">alarm 1 of the 2 the bow allows</span>
      </div>
      <div class="run">
        <span class="closed"></span>
        <span class="peg" style="left: 0"></span>
        <span class="peg" style="left: 62%"></span>
        <span class="peg" style="left: 100%"></span>
        <span class="you"><span class="nm">Nim</span><span class="pip"></span></span>
        <span class="them"><span class="nm">the boar</span><span class="pip"></span></span>
        <span class="cost">one more press &mdash; costs 1</span>
      </div>
    </div>

    <div class="reads">
      <div class="cell">
        <span class="tag">ground</span>
        <span class="val">1<i>/2</i></span>
        <span class="sub">closed so far</span>
      </div>
      <div class="cell">
        <span class="tag">alarm</span>
        <span class="val">1<i>/3</i></span>
        <span class="sub">it breaks off at 3</span>
      </div>
      <div class="cell">
        <span class="tag">it is</span>
        <span class="val small">feeding</span>
        <span class="sub">then lifting</span>
      </div>
      <div class="cell">
        <span class="tag">wind</span>
        <span class="val small">across</span>
        <span class="sub">closing costs 1</span>
      </div>
      <div class="cell">
        <span class="tag">press</span>
        <span class="val">2<i>/5</i></span>
        <span class="sub">then the light goes</span>
      </div>
      <div class="cell">
        <span class="tag">worth</span>
        <span class="val">24<i> food</i> 3<i> hide</i> 2<i> sinew</i></span>
        <span class="sub">bow allows 2 &middot; coat &minus;18%</span>
      </div>
    </div>

    <div class="moves">
      <button class="move take" type="button">
        <span>Take it</span><span class="why">now, with the bow</span>
      </button>
      <button class="move" type="button">
        <span>Close the distance</span><span class="why">costs 1 of its attention</span>
      </button>
      <button class="move" type="button">
        <span>Stand still</span><span class="why">alarm down 1, a press gone</span>
      </button>
      <button class="move away" type="button">
        <span>Back off</span><span class="why">nothing, and no holes in you</span>
      </button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
