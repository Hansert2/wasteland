<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --ground: #171614; --strip: #1E1D1A; --panel: #1E1D1A;
      --rule: #33312C; --rule-in: #26241F; --edge: #4A463E; --control: #55504E;
      --bone: #E4E1D8; --prose: #CFCBC0; --value: #DCD8CD;
      --dim: #999588; --quiet: #7A766C; --faint: #6F6B62;
      --oxide: #C2632C; --oxide-light: #DD8F4A;
      --label: 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif;
      --body: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --numer: ui-monospace, Menlo, Consolas, monospace;
    }
    body { margin: 0; background: var(--ground); color: var(--prose);
           font-family: var(--body); font-size: 16.5px; line-height: 1.6; }
    a { color: var(--dim); } a:hover { color: var(--bone); }
    .wrap { padding: 20px 24px; }
    .block { border: 1px solid var(--rule); background: var(--ground);
             display: flex; flex-direction: column; }
    .block > h2 { margin: 0; padding: 11px 18px; background: var(--strip);
      border-bottom: 1px solid var(--rule); font-family: var(--label); font-weight: 700;
      font-size: 10px; line-height: 1; letter-spacing: .18em; text-transform: uppercase;
      color: var(--dim); }
    .block-body { padding: 15px 18px; }
    .tag { font-family: var(--label); font-weight: 700; font-size: 10px; line-height: 1.4;
           letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
    .caption { margin: 0; font-family: var(--numer); font-size: 12.5px; line-height: 1.4;
               color: var(--faint); }

    /* The figure is the subject. Everything else is ranged against it. */
    .lede { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: start; }
    .odds { padding-right: 26px; border-right: 1px solid var(--rule); }
    .odds .fig { display: block; font-family: var(--numer); font-size: 58px; line-height: .95;
                 color: var(--bone); font-variant-numeric: tabular-nums; }
    .odds .fig i { font-style: normal; font-size: 24px; color: var(--quiet); }
    .odds .tag { display: block; margin-top: 6px; }

    .reads { display: flex; flex-direction: column; gap: 0; }
    .read { display: grid; grid-template-columns: 96px auto 1fr; gap: 16px;
            align-items: center; padding: 9px 0; border-bottom: 1px solid var(--rule-in); }
    .read:last-of-type { border-bottom: 0; }
    .read .val { font-family: var(--numer); font-size: 15px; color: var(--value);
                 font-variant-numeric: tabular-nums; }
    .pips { display: flex; gap: 3px; }
    .pips i { display: block; width: 26px; height: 8px; background: var(--rule-in);
              border: 1px solid var(--rule); }
    .pips i.on { background: var(--quiet); border-color: var(--edge); }
    .read .worth { display: flex; align-items: baseline; gap: 4px; font-family: var(--numer);
                   font-size: 15px; color: var(--value); }
    .read .worth i { font-style: normal; font-family: var(--label); font-size: 10px;
                     letter-spacing: .14em; text-transform: uppercase; color: var(--faint);
                     margin-right: 8px; }

    .moves { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px;
             padding-top: 16px; border-top: 1px solid var(--rule); }
    .move { display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
            min-width: 170px; padding: 11px 14px; border: 1px solid var(--control);
            background: transparent; font-family: var(--label); font-weight: 700;
            font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
            color: var(--prose); text-align: left; cursor: pointer; }
    .move .why { font-size: 10px; font-weight: 400; letter-spacing: .08em;
                 text-transform: lowercase; color: var(--faint); }
    .move.take { border-color: var(--oxide); color: var(--bone); }
    .move.away { min-width: 0; margin-left: auto; }
  </style>
</helmet>
<div class="wrap">
  <div class="block">
    <h2>Nim is out after a boar</h2>
    <div class="block-body">
      <div class="lede">
        <div class="odds">
          <span class="fig">57<i>%</i></span>
          <span class="tag">if they take it now</span>
        </div>

        <div class="reads">
          <div class="read">
            <span class="tag">ground</span>
            <span class="val">2/2</span>
            <span class="pips"><i class="on"></i><i class="on"></i></span>
          </div>
          <div class="read">
            <span class="tag">patience</span>
            <span class="val">2/3</span>
            <span class="pips"><i class="on"></i><i class="on"></i><i></i></span>
          </div>
          <div class="read">
            <span class="tag">press</span>
            <span class="val">2/5</span>
            <span></span>
          </div>
          <div class="read">
            <span class="tag">worth</span>
            <span class="worth">34<i>food</i>3<i>hide</i>2<i>sinew</i></span>
            <span></span>
          </div>
        </div>
      </div>

      <div class="moves">
        <button class="move take" type="button">
          <span>Take it</span><span class="why">now, with whatever is in hand</span>
        </button>
        <button class="move" type="button">
          <span>Close the distance</span><span class="why">quietly, and hope</span>
        </button>
        <button class="move" type="button">
          <span>Stand still</span><span class="why">let it settle, lose the ground</span>
        </button>
        <button class="move away" type="button">
          <span>Back off</span><span class="why">no holes in you</span>
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
