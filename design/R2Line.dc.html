<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --void: #0B0A08; --ground: #171614; --strip: #1E1D1A; --panel: #1E1D1A;
      --rule: #33312C; --rule-in: #26241F; --edge: #4A463E; --control: #55504E;
      --bone: #E4E1D8; --prose: #CFCBC0; --value: #DCD8CD;
      --dim: #999588; --quiet: #7A766C; --faint: #6F6B62;
      --oxide: #C2632C; --oxide-light: #DD8F4A;
      --label: 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif;
      --body: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --numer: ui-monospace, Menlo, Consolas, monospace;
    }
    body { margin: 0; background: var(--ground); color: var(--prose);
           font-family: var(--body); font-size: 16.5px; line-height: 1.6; }
    a { color: var(--dim); } a:hover { color: var(--bone); }
    .wrap { padding: 20px 24px; }
    .block { border: 1px solid var(--rule); background: var(--ground);
             display: flex; flex-direction: column; }
    .block > h2 { margin: 0; padding: 11px 18px; background: var(--strip);
      border-bottom: 1px solid var(--rule); font-family: var(--label); font-weight: 700;
      font-size: 10px; line-height: 1; letter-spacing: .18em; text-transform: uppercase;
      color: var(--dim); }
    .block-body { padding: 15px 18px; }
    .tag { font-family: var(--label); font-weight: 700; font-size: 10px; line-height: 1.4;
           letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }

    /* ---- the approach, as one line read left to right ---- */
    .field { position: relative; padding: 30px 0 22px; }
    .line { position: relative; height: 1px; background: var(--rule); }
    /* Ground already closed, drawn on the line itself rather than beside it. */
    .closed { position: absolute; left: 0; top: 0; height: 1px; width: 50%;
              background: var(--oxide); }
    .mark { position: absolute; top: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .mark .fig { display: block; }
    .mark .who { font-family: var(--label); font-weight: 700; font-size: 9.5px;
                 letter-spacing: .16em; text-transform: uppercase; color: var(--faint);
                 white-space: nowrap; }
    .mark.you { left: 50%; }
    .mark.them { left: 100%; }
    .mark.start { left: 0; }
    .mark.start .dot { width: 5px; height: 5px; background: var(--rule);
                       transform: rotate(45deg); }
    /* The stops the survivor moves between: two presses of ground. */
    .stop { position: absolute; top: 50%; width: 1px; height: 11px;
            background: var(--rule); transform: translate(-50%, -50%); }
    /* What the next step costs, hung under the gap it belongs to. */
    .cost { position: absolute; top: calc(50% + 16px); transform: translateX(-50%);
            font-family: var(--numer); font-size: 11.5px; color: var(--oxide-light);
            white-space: nowrap; }
    .cost.free { color: var(--quiet); }

    .reads { display: flex; gap: 0; margin-top: 6px; border: 1px solid var(--rule);
             background: var(--panel); }
    .cell { display: flex; flex-direction: column; gap: 4px; padding: 13px 20px;
            border-right: 1px solid var(--rule); }
    .cell:last-child { border-right: 0; }
    .cell .val { font-family: var(--numer); font-size: 18px; line-height: 1.15;
                 color: var(--value); font-variant-numeric: tabular-nums; }
    .cell .val.word { font-family: var(--label); font-weight: 700; font-size: 22px;
                      letter-spacing: .03em; text-transform: uppercase; color: var(--bone); }
    .cell .sub { font-family: var(--numer); font-size: 11px; color: var(--faint); }

    .moves { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
    .move { display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
            min-width: 172px; padding: 12px 14px; border: 1px solid var(--control);
            background: var(--panel); font-family: var(--label); font-weight: 700;
            font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
            color: var(--prose); text-align: left; cursor: pointer; }
    .move .why { font-size: 10px; font-weight: 400; letter-spacing: .08em;
                 text-transform: lowercase; color: var(--faint); }
    .move.take { border-color: var(--oxide); }
    .move.away { min-width: 0; }
  </style>
</helmet>
<div class="wrap">
  <div class="block">
    <h2>Nim is out after a boar</h2>
    <div class="block-body">

      <div class="field">
        <div class="line">
          <span class="closed"></span>
          <span class="stop" style="left: 0"></span>
          <span class="stop" style="left: 50%"></span>
          <span class="stop" style="left: 100%"></span>

          <span class="cost free" style="left: 25%">closed &mdash; cost 0</span>
          <span class="cost" style="left: 75%">next step costs 1</span>

          <span class="mark start"><span class="dot"></span></span>

          <span class="mark you">
            <svg class="fig" width="16" height="34" viewBox="0 0 16 34" aria-hidden="true">
              <circle cx="8" cy="4" r="3.2" fill="none" stroke="#E4E1D8" stroke-width="1.4"/>
              <path d="M8 7.5 V21 M8 11 L2 16 M8 11 L14 16 M8 21 L3 33 M8 21 L13 33"
                    fill="none" stroke="#E4E1D8" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <span class="who">Nim</span>
          </span>

          <span class="mark them">
            <svg class="fig" width="52" height="30" viewBox="0 0 52 30" aria-hidden="true">
              <path d="M4 20 C6 12 13 8 22 8 C31 8 39 10 44 14 L50 13 L47 18
                       C47 24 42 26 36 26 L34 26 L33 30 M14 26 L13 30 M24 26 L23 30
                       M40 26 L41 30"
                    fill="none" stroke="#DD8F4A" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="45" cy="16" r="1" fill="#DD8F4A"/>
            </svg>
            <span class="who">a boar</span>
          </span>
        </div>
      </div>

      <div class="reads">
        <div class="cell">
          <span class="tag">the shot</span>
          <span class="val word">Clean</span>
          <span class="sub">1 of 2 allowed</span>
        </div>
        <div class="cell">
          <span class="tag">alarm</span>
          <span class="val">1<span style="color:#6F6B62">/3</span></span>
          <span class="sub">it lifts its head at 3</span>
        </div>
        <div class="cell">
          <span class="tag">it is</span>
          <span class="val">feeding</span>
          <span class="sub">then lifting</span>
        </div>
        <div class="cell">
          <span class="tag">wind</span>
          <span class="val">across</span>
          <span class="sub">no help either way</span>
        </div>
        <div class="cell">
          <span class="tag">press</span>
          <span class="val">2<span style="color:#6F6B62">/5</span></span>
          <span class="sub">worth 24 food</span>
        </div>
      </div>

      <div class="moves">
        <button class="move take" type="button">
          <span>Take it</span><span class="why">now, with the bow</span>
        </button>
        <button class="move" type="button">
          <span>Close the distance</span><span class="why">costs 1 of its attention</span>
        </button>
        <button class="move" type="button">
          <span>Stand still</span><span class="why">alarm down 1, a press gone</span>
        </button>
        <button class="move away" type="button">
          <span>Back off</span><span class="why">nothing, and no holes in you</span>
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
